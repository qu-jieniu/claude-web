# Loaded only when omp-launcher starts a new server; never re-source a live host.
# UTF-8 is enforced by the launcher (tmux -u and a UTF-8 locale).
set -g default-terminal 'tmux-256color'
set -g default-shell /bin/bash
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind d detach-client

set -g mouse on
set -g status-position top
set -g status-left ''
set -g status-right ''
set -g status-justify left
set -g status-style 'bg=colour235,fg=colour250'
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W* '
setw -g window-status-current-style 'bg=colour24,fg=colour255,bold'
set -g set-titles on
set -g set-titles-string '#S:#{window_id}:#W'
setw -g automatic-rename off
setw -g window-size smallest
setw -g aggressive-resize off
set -g history-limit 100000
setw -g remain-on-exit failed
setw -g mode-keys vi
set -g set-clipboard on

# Outside alternate-screen applications the wheel enters copy-mode without -M:
# -M starts a mouse selection and moves the resize anchor away from the top.
bind -n WheelUpPane if-shell -F -t = '#{alternate_on}' 'send-keys -M' 'copy-mode -e -t =; send-keys -X -t = scroll-up'
bind -n WheelDownPane if-shell -F -t = '#{alternate_on}' 'send-keys -M' 'if-shell -F -t = "#{pane_in_mode}" "send-keys -X -t = scroll-down"'
set-hook -g after-copy-mode[50] 'if-shell -F "#{&&:#{pane_in_mode},#{&&:#{!:#{selection_active}},#{!:#{selection_present}}}}" "send-keys -X top-line"'
bind -T copy-mode-vi WheelUpPane send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi Enter send-keys -X cancel
bind -n MouseDrag1Pane if-shell -F -t = '#{alternate_on}' 'send-keys -M' 'copy-mode -M -t ='
bind -T copy-mode-vi MouseDrag1Pane send-keys -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-selection-no-clear
bind -n DoubleClick1Pane if-shell -F -t = '#{alternate_on}' 'send-keys -M' 'copy-mode -t =; send-keys -X -t = select-word; send-keys -X -t = copy-selection-no-clear'

# Shell source is constant: project paths go through tmux -c/-d, not interpolation.
bind c new-window -c '#{pane_current_path}' /bin/bash -lc 'root="${OMP_WEB_ROOT:-/opt/omp-web}"; set -- omp -c --allow-home --config "$root/omp-config.yml" --extension "$root/omp-web-composer-bridge.ts"; if [ -n "${OMP_SESSION_DIR:-}" ]; then set -- "$@" --session-dir "$OMP_SESSION_DIR"; fi; "$@"; result=$?; if [ "$result" -ne 0 ]; then exit "$result"; fi; exec /bin/bash -i'
bind C new-window -n shell -c '#{pane_current_path}' /bin/bash -il
bind R respawn-pane
bind j display-popup -E -w 90% -h 90% -d '#{pane_current_path}' 'root="${OMP_WEB_ROOT:-/opt/omp-web}"; exec "$root/omp-jsonl-view" --popup --cwd "$PWD"'
