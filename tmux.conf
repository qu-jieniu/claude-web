# Loaded only when omp-launcher starts a new server; never re-source a live host.
# UTF-8 is enforced by the launcher (tmux -u and a UTF-8 locale).
set -g default-terminal 'tmux-256color'
set -g default-shell /bin/bash
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind d detach-client

set -g mouse on
# No tmux status line: the frontend draws its own window bar from /windows -
# thumb-sized, and it also lists windows in other sessions. tmux's was a single
# text row (hard to tap accurately) and it cost a terminal row on every client,
# native ones included. setw window-status-format* are inert with status off.
set -g status off
set -g set-titles on
set -g set-titles-string '#S:#{window_id}:#W'
setw -g automatic-rename off
setw -g window-size latest
setw -g aggressive-resize on
set -g default-size 84x50
set -g history-limit 100000
# Ordinary shells close on exit regardless of the last command's status.
# The OMP wrapper opts its pane into failure retention only while OMP runs.
setw -g remain-on-exit off
setw -g mode-keys vi
set -g set-clipboard on
# Inline images: omp wraps its SIXEL output in a DCS passthrough envelope, and
# tmux drops passthrough by default (3.3+), so the client never sees the image -
# it arrives as the blank block the app had reserved. The frontend renders SIXEL
# through @xterm/addon-image. Tradeoff: a program in a pane can then emit
# sequences straight to the browser terminal; acceptable on a single-user
# terminal, and required for images at all.
set -g allow-passthrough on

# Outside alternate-screen applications the wheel enters copy-mode without -M:
# -M starts a mouse selection and moves the resize anchor away from the top.
bind -n WheelUpPane if-shell -F -t = '#{alternate_on}' 'send-keys -M' 'copy-mode -e -t =; send-keys -X -t = scroll-up'
bind -n WheelDownPane if-shell -F -t = '#{alternate_on}' 'send-keys -M' 'if-shell -F -t = "#{pane_in_mode}" "send-keys -X -t = scroll-down-and-cancel"'
set-hook -g after-copy-mode[50] 'if-shell -F "#{&&:#{pane_in_mode},#{&&:#{!:#{selection_active}},#{!:#{selection_present}}}}" "send-keys -X top-line"'
# Scrolling cancels any selection first: tmux extends an active selection as
# the cursor moves, and scrolling moves it - so without this, scrolling after a
# selection dragged the selection along with it ("selects everything on the
# way"). clear-selection resets the anchor, not just the visible selection.
# One line per wheel report rather than three. The browser sends one report per
# wheel notch (WHEEL_REPORTS in web/app.js) and 4.5 per terminal row of finger
# travel (its touch multiplier is scaled to match this count), so a computer
# notch moves 1 line while a phone swipe keeps the distance it had when this
# binding scrolled 3. Native clients attached to this server inherit the slower
# rate - they send one report per notch too.
bind -T copy-mode-vi WheelUpPane send-keys -X clear-selection \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X clear-selection \; send-keys -X -N 1 scroll-down-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi Enter send-keys -X cancel
bind -n MouseDrag1Pane if-shell -F -t = '#{alternate_on}' 'send-keys -M' 'copy-mode -M -t ='
bind -T copy-mode-vi MouseDrag1Pane send-keys -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-selection-no-clear
bind -n DoubleClick1Pane if-shell -F -t = '#{alternate_on}' 'send-keys -M' 'copy-mode -t =; send-keys -X -t = select-word; send-keys -X -t = copy-selection-no-clear'

# Shell source is constant: project paths go through tmux -c/-d, not interpolation.
bind c new-window -c '#{pane_current_path}' /bin/bash -lc 'exec "${OMP_WEB_ROOT:-/opt/omp-web}/omp-launcher" --new-omp'
bind C new-window -n shell -c '#{pane_current_path}' /bin/bash -il
bind R respawn-pane
bind j display-popup -E -w 90% -h 90% -d '#{pane_current_path}' 'root="${OMP_WEB_ROOT:-/opt/omp-web}"; exec "$root/omp-jsonl-view" --popup --cwd "$PWD"'
