<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Claude</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<iframe id="t" allow="clipboard-read; clipboard-write"></iframe>
<script>
(function () {
  var f = document.getElementById('t');

  // Carry any ?arg=<session> from our URL into the ttyd iframe so ttyd (-a)
  // forwards it to the launcher for direct-attach.
  var arg = new URLSearchParams(location.search).get('arg');
  f.src = '/t/' + (arg ? '?arg=' + encodeURIComponent(arg) : '');
  f.addEventListener('load', function () { try { f.contentWindow.focus(); } catch (e) {} });

  // The launcher sets the terminal title via OSC: "claude-<session>" inside a
  // session, "claude-launcher" at the menu. ttyd reflects that into the iframe's
  // document.title but appends its own base title, so the value is actually
  // "claude-<session> | <base>". We parse only the leading claude-<suffix> token
  // (suffix is sanitized to [A-Za-z0-9_-], so it stops cleanly before " | ") and
  // mirror it into our address bar, so reopening the tab restores the session via
  // ?arg=. Titles that don't start with claude- (ttyd's default / transient init)
  // are left alone so they can't wipe a valid arg before attach completes.
  var last = null;
  setInterval(function () {
    var t;
    try { t = f.contentDocument && f.contentDocument.title; } catch (e) { return; }
    if (!t || t === last) return;
    last = t;
    var m = /^claude-([A-Za-z0-9_-]+)/.exec(t);
    if (!m) return;
    var s = m[1];
    var u = new URL(location.href);
    var cur = u.searchParams.get('arg');
    if (s === 'launcher') {
      if (cur !== null) { u.searchParams.delete('arg'); history.replaceState(null, '', u.href); }
      document.title = 'Claude';
    } else {
      if (cur !== s) { u.searchParams.set('arg', s); history.replaceState(null, '', u.href); }
      document.title = 'claude-' + s;
    }
  }, 700);
})();
</script>
</body>
</html>
