<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content: Android shrinks the layout viewport
     when the soft keyboard opens, so the inner ttyd refits. iOS ignores it;
     the visualViewport handler below covers Safari. viewport-fit=cover +
     safe-area padding keep the key bar off the notch/home indicator. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/png" href="/favicon.png">
<title>omp</title>
<style>
  :root { color-scheme: dark; font: 15px system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  iframe { border: 0; display: block; width: 100%; flex: 0 0 auto; min-height: 0; }
  /* Include hybrid tablets/laptops with both touch and a fine pointer. */
  #keys {
    display: none; flex: 0 0 auto; gap: 4px; padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    padding-left: max(6px, env(safe-area-inset-left)); padding-right: max(6px, env(safe-area-inset-right));
    background: #111; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch;
  }
  @media (any-pointer: coarse) { #keys { display: flex; } }
  #keys button {
    flex: 0 0 auto; min-width: 44px; min-height: 44px; border-radius: 8px;
    background: #222; color: #ccc; border: 1px solid #333;
    font: 15px system-ui, sans-serif; padding: 4px 10px; user-select: none; touch-action: manipulation;
  }
  #keys button:active { background: #3a7a3a; color: #fff; }
  #keys button.armed { background: #234d23; color: #e0ffe0; border-color: #3a7a3a; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid #9ddcff; outline-offset: -2px; }
  #notice { position: fixed; left: 12px; right: 12px; top: max(12px, env(safe-area-inset-top));
    width: fit-content; max-width: calc(100% - 48px); margin: auto; padding: 10px 12px;
    border: 1px solid #777; border-radius: 8px; background: #222; color: #fff; pointer-events: none; }
  #notice:empty { display: none; }
  dialog { box-sizing: border-box; width: min(480px, calc(100% - 24px)); max-height: 90%;
    overflow: auto; border: 1px solid #777; border-radius: 10px; background: #181818; color: #eee; padding: 16px; }
  dialog::backdrop { background: #0009; }
  dialog label { display: block; margin-bottom: 10px; }
  dialog textarea { box-sizing: border-box; width: 100%; min-height: 100px; font: 16px monospace; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  dialog button { min-height: 44px; padding: 8px 16px; font: inherit; }
</style>
</head>
<body>
<main id="app">
<iframe id="t" title="OMP terminal" allow="clipboard-read; clipboard-write"></iframe>
<div id="keys" role="group" aria-label="Terminal keys">
  <button data-k="esc" aria-label="Escape">Esc</button>
  <button data-k="tab">Tab</button>
  <button data-k="up" aria-label="Arrow up">↑</button>
  <button data-k="down" aria-label="Arrow down">↓</button>
  <button data-k="left" aria-label="Arrow left">←</button>
  <button data-k="right" aria-label="Arrow right">→</button>
  <button data-k="cc" aria-label="Control C: interrupt">^C</button>
  <button data-k="cd" aria-label="Control D: end of input">^D</button>
  <button data-k="cl" aria-label="Control L: clear screen">^L</button>
  <button data-k="prefix" id="btnPrefix" aria-label="Control A: tmux prefix" aria-pressed="false">⌃A</button>
  <button data-k="detach" aria-label="Detach from session">Detach</button>
  <button data-k="paste">Paste</button>
</div>
</main>
<div id="notice" role="status" aria-live="polite"></div>
<dialog id="pasteDialog" aria-labelledby="pasteLabel">
  <form method="dialog">
    <label id="pasteLabel" for="pasteText">Paste text into the terminal</label>
    <textarea id="pasteText" placeholder="Use your keyboard or touch-and-hold to paste here" autofocus></textarea>
    <div class="actions"><button value="cancel">Cancel</button><button id="pasteSend" value="send">Send text</button></div>
  </form>
</dialog>
<script>
(function () {
  var f = document.getElementById('t');

  // Carry any ?arg=<session> from our URL into the ttyd iframe so ttyd (-a)
  // forwards it to the launcher for direct-attach. rendererType=dom forces the
  // DOM renderer: the WebGL default has no per-glyph font fallback, so rare
  // glyphs (⟦⟧, ⌦, …) render as underscore boxes on devices whose mono font
  // lacks them. The DOM renderer lets the browser fall back per glyph.
  var arg = new URLSearchParams(location.search).get('arg');
  f.src = '/t/?rendererType=dom' + (arg ? '&arg=' + encodeURIComponent(arg) : '');
  f.addEventListener('load', function () {
    armPrefix(false);
    // ttyd 1.7.7 caches its initial wsUrl. A session chosen in the menu must
    // still be used on the next connection, without reloading a live terminal.
    var iw = f.contentWindow;
    var NativeWebSocket = iw.WebSocket;
    iw.WebSocket = class extends NativeWebSocket {
      constructor(url, protocols) {
        var next = new URL(url, iw.location.href);
        if (next.host === iw.location.host && next.pathname === '/t/ws') {
          var current = new URLSearchParams(iw.location.search).get('arg');
          if (current) next.searchParams.set('arg', current);
          else next.searchParams.delete('arg');
        }
        super(next.href, protocols);
      }
    };
    initTouch();
  });
  // Size the frame once; ttyd owns fitting the terminal inside it.
  applySize();

  function term() {
    try { return f.contentWindow && f.contentWindow.term; } catch (e) { return null; }
  }

  // One sizing path for desktop resize and the mobile keyboard. Never infer
  // terminal state or move its scroll position: tmux owns the history view.
  // OMP's tui.resizeScrollback=preserve prevents transcript replay on resize.
  var resizeFrame = 0;
  function applySize() {
    var app = document.getElementById('app');
    var vv = window.visualViewport;
    // visualViewport dimensions shrink with zoom as well as the keyboard.
    // Normalize zoom instead of skipping updates: skipping can strand the
    // frame at keyboard-open height after the keyboard closes.
    var height = vv ? Math.min(vv.height * vv.scale, window.innerHeight) : window.innerHeight;
    app.style.height = Math.max(1, Math.floor(height)) + 'px';
    app.style.top = (vv && Math.abs(vv.scale - 1) < 0.01 ? vv.offsetTop : 0) + 'px';
    var style = getComputedStyle(app);
    f.style.height = Math.max(1, app.clientHeight - parseFloat(style.paddingTop) -
      parseFloat(style.paddingBottom) - document.getElementById('keys').offsetHeight) + 'px';
  }
  function scheduleSize() {
    if (resizeFrame) return;
    resizeFrame = requestAnimationFrame(function () {
      resizeFrame = 0;
      applySize();
    });
  }
  window.addEventListener('resize', scheduleSize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleSize);
    window.visualViewport.addEventListener('scroll', scheduleSize);
  }

  // Touch bridge: swipes must reach tmux copy-mode. With mouse tracking on,
  // xterm.js neither scroll-scrolls on touch nor synthesizes wheel events, so
  // a phone cannot read history at all. Translate vertical swipes into real
  // WheelEvents on the term element — the exact path a desktop wheel uses
  // (xterm → SGR → tmux copy-mode / alternate-screen apps). One wheel event
  // scrolls one tmux line (conf sends -N1), so emit per-cell-height chunks.
  function initTouch() {
    var t = term();
    if (!t || !t.element) return;
    var el = t.element;
    if (el.dataset.touchBridge) { return; }
    el.dataset.touchBridge = '1';
    el.style.touchAction = 'pinch-zoom';
    var pointerId = null, lastY = 0, swiped = false;
    var touches = new Set();
    // The DOM renderer replaces the touched row during scroll. TouchEvents
    // then keep targeting that detached row and never reach our old listener.
    // Capture the pointer on the stable terminal element for the whole swipe.
    el.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'touch') return;
      touches.add(e.pointerId);
      if (touches.size !== 1) {
        if (pointerId !== null && el.hasPointerCapture(pointerId)) el.releasePointerCapture(pointerId);
        pointerId = null;
        return;
      }
      pointerId = e.pointerId;
      lastY = e.clientY;
      swiped = false;
      el.setPointerCapture(pointerId);
    });
    el.addEventListener('pointermove', function (e) {
      if (e.pointerId !== pointerId) return;
      var dy = lastY - e.clientY;
      var screen = el.querySelector('.xterm-screen') || el;
      var cellH = screen.getBoundingClientRect().height / t.rows || 16;
      var lines = Math.trunc(dy / cellH);
      if (!lines) return;
      lastY -= lines * cellH;
      swiped = true;
      e.preventDefault();
      // Without mouse tracking, scroll xterm's history directly; never send
      // cursor keys to the shell or double-scroll through its touch handler.
      if (t.modes.mouseTrackingMode === 'none') { t.scrollLines(lines); return; }
      var delta = lines > 0 ? 120 : -120;
      // xterm's wheel handler lives on its .xterm-viewport child — dispatch
      // there; textarea/element events bubble around it and are ignored.
      var target = (t.element.querySelector('.xterm-viewport') || t.textarea || el);
      for (var i = 0; i < Math.abs(lines); i++) {
        target.dispatchEvent(new WheelEvent('wheel', {
          deltaY: delta, clientX: e.clientX, clientY: e.clientY,
          bubbles: true, cancelable: true
        }));
      }
    }, { passive: false });
    function endPointer(e) {
      touches.delete(e.pointerId);
      if (e.pointerId === pointerId) pointerId = null;
    }
    el.addEventListener('pointerup', endPointer);
    el.addEventListener('pointercancel', endPointer);
    el.addEventListener('lostpointercapture', endPointer);
    // The pointer bridge owns one-finger scrolling, not xterm's touch path.
    el.addEventListener('touchmove', function (e) {
      if (e.touches.length !== 1) return;
      e.preventDefault();
      e.stopImmediatePropagation();
    }, { capture: true, passive: false });
    el.addEventListener('click', function (e) {
      if (!swiped) return;
      swiped = false;
      e.preventDefault();
      e.stopImmediatePropagation();
    }, true);
    // ⌃A armed + a keyboard letter → tmux prefix command. Best effort: some
    // Android IMEs never produce real keydown events; toolbar keys always work.
    el.addEventListener('keydown', function (e) {
      if (!pendingPrefix || e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return;
      e.preventDefault(); e.stopPropagation();
      var t2 = term();
      if (t2 && t2.input) t2.input('\x01' + e.key);
      armPrefix(false);
    }, true);
    // OSC52 → browser clipboard: ttyd 1.7.7's xterm 5.4 registers no OSC52
    // handler, so tmux copy-selection (set-clipboard on) never reached the
    // browser. Bridge it here. Callback data is "Pc;base64" (no "52;" prefix;
    // Pc may hold selection chars; '?' means a clipboard QUERY — never read
    // clipboard for those). Decode bytes as UTF-8; return true synchronously
    // and catch writeText rejections so a denied permission can't stall the
    // terminal parser.
    if (t.parser && t.parser.registerOscHandler && !t._osc52hooked) {
      t._osc52hooked = true;
      t.parser.registerOscHandler(52, function (data) {
        try {
          var semi = data.indexOf(';');
          var sel = semi >= 0 ? data.slice(0, semi) : '';
          if (sel.indexOf('?') >= 0) return true;
          var b64 = semi >= 0 ? data.slice(semi + 1) : data;
          if (!b64 || b64 === '?') return true;
          var bin = atob(b64.replace(/[^A-Za-z0-9+/=]/g, ''));
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          var text = new TextDecoder().decode(bytes);
          var w = f.contentWindow.navigator.clipboard || navigator.clipboard;
          if (w && w.writeText) w.writeText(text).catch(function () {
            notify('Clipboard access denied. Use the terminal selection and your device’s Copy action.');
          });
        } catch (e) {}
        return true;
      });
    }
  }

  // Mirror the session into the bookmark and iframe URL without a reload.
  // The WebSocket adapter above uses the iframe URL on reconnect because
  // ttyd caches its original wsUrl instead of rereading location.search.
  function setArg(val) {
    var u = new URL(location.href);
    if (val === null) u.searchParams.delete('arg'); else u.searchParams.set('arg', val);
    if (u.href !== location.href) history.replaceState(null, '', u.href);
    try {
      var iw = f.contentWindow;
      var iu = new URL(iw.location.href);
      if (val === null) iu.searchParams.delete('arg'); else iu.searchParams.set('arg', val);
      if (iu.href !== iw.location.href) iw.history.replaceState(null, '', iu.href);
    } catch (e) {}
  }

  // The launcher sets the terminal title via OSC: "omp-<session>" inside a
  // session, "omp-launcher" at the menu. ttyd reflects that into the iframe's
  // document.title but appends its own base title, so the value is actually
  // "omp-<session> | <base>". We parse only the leading omp-<suffix> token
  // (suffix is sanitized to [A-Za-z0-9_-], so it stops cleanly before " | ").
  // Titles that don't start with omp- (ttyd's default / transient init) are
  // left alone so they can't wipe a valid arg before attach completes.
  var last = null;
  setInterval(function () {
    // initTouch before the title-diff guard: a reload into the SAME session
    // (identical title) must still arm handlers on the fresh terminal.
    initTouch();
    var t;
    try { t = f.contentDocument && f.contentDocument.title; } catch (e) { return; }
    if (!t || t === last) return;
    last = t;
    // tmux (set-titles on) publishes "#S:#{window_id}:#{W}" titles on window
    // switches (e.g. "1:@3:trader-go"). Sync ?arg= to the CURRENT window so a
    // tab reload reattaches it. Deliberately NO scrollToBottom here — yanking
    // the viewport on switch is what made reading scrollback impossible;
    // copy-mode position survives switches on its own. Session names are
    // arbitrary — match everything up to the :@id: separator.
    var tm = /^[^:]+:@(\d+):/.exec(t);
    if (tm) { setArg('tmux-' + tm[1]); document.title = t.split(' | ')[0]; return; }
    var m = /^omp-([A-Za-z0-9_-]+)/.exec(t);
    if (!m) return;
    var s = m[1];
    if (s === 'launcher') { setArg(null); document.title = 'omp'; }
    else { setArg(s); document.title = 'omp-' + s; }
  }, 700);

  // Mobile key bar — inject the keys soft keyboards don't have. Sent through
  // xterm's own input() so the pty sees real keystrokes. Arrow keys honor
  // applicationCursorKeysMode (DECCKM): ESC O x when set, ESC [ x otherwise.
  var pendingPrefix = false;   // ⌃A armed: next key goes through the tmux prefix
  function armPrefix(on) {
    pendingPrefix = on;
    var b = document.getElementById('btnPrefix');
    if (b) { b.classList.toggle('armed', on); b.setAttribute('aria-pressed', String(on)); }
  }
  var noticeTimer;
  function notify(message) {
    clearTimeout(noticeTimer);
    document.getElementById('notice').textContent = message;
    noticeTimer = setTimeout(function () { document.getElementById('notice').textContent = ''; }, 6000);
  }
  function focusTerminal() {
    var t = term();
    if (t) t.focus();
  }
  function sendKey(data) {
    var t = term();
    if (!t) { notify('Terminal is not ready yet.'); return; }
    if (pendingPrefix) { data = '\x01' + data; armPrefix(false); }
    if (t.input) t.input(data);
    focusTerminal();
  }
  var KEYMAP = {
    esc: '\x1b', tab: '\t', cc: '\x03', cd: '\x04', cl: '\x0c'
  };
  var ARROWS = { up: 'A', down: 'B', right: 'C', left: 'D' };
  // Keep a tap from blurring xterm's textarea and dismissing the soft keyboard.
  // Do not cancel touchstart: the key strip must remain horizontally scrollable.
  document.getElementById('keys').addEventListener('mousedown', function (e) {
    if (e.target.closest('button')) e.preventDefault();
  });
  var pasteDialog = document.getElementById('pasteDialog');
  var pasteText = document.getElementById('pasteText');
  var pasteTarget = null;
  function pasteInto(target, text) {
    if (!target || target !== term()) { notify('The terminal changed. Paste again in the active session.'); return; }
    target.paste(text);
    focusTerminal();
  }
  pasteDialog.addEventListener('close', function () {
    if (pasteDialog.returnValue === 'send') pasteInto(pasteTarget, pasteText.value);
    else focusTerminal();
    pasteText.value = '';
    pasteTarget = null;
  });
  function manualPaste(target) {
    if (target !== term()) { notify('The terminal changed. Paste again in the active session.'); return; }
    pasteTarget = target;
    pasteDialog.returnValue = '';
    pasteDialog.showModal();
  }
  document.getElementById('keys').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var k = b.dataset.k;
    if (k === 'prefix') { armPrefix(!pendingPrefix); focusTerminal(); return; }
    if (k === 'detach') { armPrefix(false); sendKey('\x01d'); return; }
    if (k === 'paste') {
      armPrefix(false);
      var target = term();
      if (!target) { notify('Terminal is not ready yet.'); return; }
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function (text) {
          // xterm applies bracketed paste and normalizes line endings.
          pasteInto(target, text);
        }).catch(function () { manualPaste(target); });
      } else manualPaste(target);
      return;
    }
    if (KEYMAP[k]) { sendKey(KEYMAP[k]); return; }
    if (ARROWS[k]) {
      var t = term();
      var pre = (t && t.modes && t.modes.applicationCursorKeysMode) ? '\x1bO' : '\x1b[';
      sendKey(pre + ARROWS[k]);
    }
  });
})();
</script>
</body>
</html>
